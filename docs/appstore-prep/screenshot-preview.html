<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>DSH Remote 商店截图终稿（6 张，1290×2796）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f2f3f7; color: #1f2430; padding: 24px 16px 80px; }
  h1 { font-size: 20px; text-align: center; margin-bottom: 4px; }
  .sub { text-align: center; color: #6b7280; font-size: 13px; margin-bottom: 28px; }
  .grid { max-width: 860px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
  .card { background: #fff; border-radius: 14px; padding: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .card .no { font-size: 12px; font-weight: 700; color: #fff; background: #3b82f6; border-radius: 999px; padding: 2px 10px; display: inline-block; margin-bottom: 8px; }
  .card img { width: 100%; border-radius: 10px; border: 1px solid #e5e7eb; display: block; }
  .card .name { margin-top: 8px; font-size: 12px; color: #6b7280; word-break: break-all; }
  .note { max-width: 860px; margin: 28px auto 0; background: #fff; border-radius: 14px; padding: 16px 20px; font-size: 13px; color: #374151; line-height: 1.8; }
</style>
</head>
<body>
<h1>DSH Remote 商店截图 · 终稿</h1>
<p class="sub">6 张 · 全部 1290×2796（官方 6.7" 尺寸）· 按上架顺序 01 → 06</p>
<div class="grid">
  <div class="card"><span class="no">1</span><img src="./screenshots/final/01.png" alt="01"><div class="name">01.png（原 shot-s1）</div></div>

  <div class="card"><span class="no">5</span><img src="./screenshots/final/05.png" alt="05"><div class="name">05.png（原 shot-s5）</div></div>
  <div class="card"><span class="no">6</span><img src="./screenshots/final/06.png" alt="06"><div class="name">06.png（原 shot-s6）</div></div>

<div class="note">💡 这 6 张为最终确认版（用户提供，已按 shot-s1 → s6 顺序排列）。上架时按 01→06 顺序上传。如某张内容需要调整顺序，告诉我编号即可。</div>
