name: Build & Upload 掌中鲸 1.0

on:
  push:
    branches: [release/1.0]
    paths: ['ios/**', '.github/workflows/release-1.0.yml']
  workflow_dispatch:

jobs:
  build-upload:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Import signing identity & profile
        run: |
          echo "${{ secrets.DIST_P12 }}" | base64 --decode > /tmp/dist.p12
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.APP_STORE_PROFILE }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/dshremote.mobileprovision
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import /tmp/dist.p12 -k build.keychain -P "${{ secrets.P12_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain

      - name: Build archive
        run: |
          cd ios/DSHRemote
          xcodebuild -project DSHRemote.xcodeproj -scheme DSHRemote -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DSHRemote.xcarchive archive

      - name: Export IPA
        run: |
          cd ios/DSHRemote
          xcodebuild -exportArchive -archivePath build/DSHRemote.xcarchive \
            -exportPath build/ipa -exportOptionsPlist exportOptions.plist

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_P8_B64: ${{ secrets.ASC_P8 }}
        run: |
          echo "$ASC_P8_B64" | base64 --decode > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8
          brew install asc > /dev/null 2>&1 || true
          asc auth login --name "ci-upload" --key-id "$ASC_KEY_ID" --issuer-id "$ASC_ISSUER_ID" \
            --private-key /tmp/AuthKey.p8 --bypass-keychain
          cd ios/DSHRemote
          asc publish appstore --app "6801499896" --ipa "build/ipa/DSHRemote.ipa" \
            --version "1.0" --wait --confirm

      - name: Report status
        if: always()
        run: |
          echo "Workflow finished. Check build in App Store Connect."
